[build]
  command = "npm install --legacy-peer-deps && npm run build"
  publish = ".next"
  PHP_VERSION = "8.3"

[build.environment]
  NODE_VERSION = "18.18.2"  # Matches React 18 requirements
  NPM_FLAGS = "--legacy-peer-deps"
  GO_VERSION = ""  # Disables Go installation

[context.production.environment]
  NEXT_PUBLIC_ENV = "production"
  NEXT_PUBLIC_GA_ID = "UA-XXXXXX-X"  # Must match your actual GA ID
